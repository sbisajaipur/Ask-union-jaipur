<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SBISA Overtime Calculator</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f3f6;font-family:Arial,Helvetica,sans-serif;color:#222}
.container{max-width:780px;margin:auto;padding:16px}
.header{background:#8b1028;color:#fff;padding:18px 20px;border-radius:14px;margin-bottom:14px}
.header h1{margin:0;font-size:22px}
.header p{margin:5px 0 0;font-size:12px}
.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.card h2{margin:0 0 14px;color:#8b1028;font-size:16px;border-bottom:1px solid #ddd;padding-bottom:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.full{grid-column:1/-1}
label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}
input,select{width:100%;padding:11px;border:1px solid #cbd0d7;border-radius:8px;font-size:15px;background:#fff}
.buttons{display:flex;gap:10px;flex-wrap:wrap}
button{border:0;border-radius:8px;padding:12px 18px;font-weight:700;cursor:pointer}
.primary{background:#8b1028;color:#fff}.secondary{background:#e8e8e8}
#status{font-size:12px;margin-top:10px}
@media(max-width:620px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🧮 Overtime Calculator</h1>
    <p>SBISA UDAIPUR MODULE</p>
  </div>

  <form id="form">
    <div class="card">
      <h2>Employee Details</h2>
      <div class="grid">
        <div><label>Employee Name *</label><input id="name" required></div>
        <div><label>PF No. *</label><input id="pf" required></div>
        <div><label>Branch Name *</label><input id="branch" required></div>
        <div><label>Branch Code *</label><input id="branchCode" required></div>
        <div><label>Date *</label><input id="date" type="date" required></div>
        <div><label>Day *</label>
          <select id="day">
            <option>Monday</option><option>Tuesday</option><option>Wednesday</option>
            <option>Thursday</option><option>Friday</option><option>Saturday</option>
            <option>Sunday</option><option>Holiday</option>
          </select>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Overtime Details</h2>
      <div class="grid">
        <div><label>Gross Salary *</label><input id="gross" type="number" min="0" step="0.01" required></div>
        <div><label>OT Type *</label>
          <select id="type">
            <option value="weekday">Week Day - After Business Hours</option>
            <option value="holiday">Sunday / Holiday</option>
          </select>
        </div>
        <div><label>OT Hours *</label><input id="hours" type="number" min="0" step="1" value="0" required></div>
        <div><label>OT Minutes *</label><input id="minutes" type="number" min="0" max="59" step="1" value="0" required></div>
      </div>
    </div>

    <div class="card">
      <div class="buttons">
        <button class="primary" type="submit">Calculate & Generate PDF</button>
        <button class="secondary" type="reset">Reset</button>
      </div>
      <div id="status"></div>
    </div>
  </form>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const val=id=>$(id).value.trim();

function money(n){
  return Number(n||0).toFixed(2);
}
function dateDMY(){
  const s=val("date");
  if(!s)return "";
  const [y,m,d]=s.split("-");
  return d+"-"+m+"-"+y;
}
function text(doc,t,x,y,size=9,bold=false){
  doc.setFont("helvetica",bold?"bold":"normal");
  doc.setFontSize(size);
  doc.setTextColor(35,35,35);
  doc.text(String(t),x,y);
}
function rightText(doc,t,x,y,size=9,bold=false){
  doc.setFont("helvetica",bold?"bold":"normal");
  doc.setFontSize(size);
  doc.setTextColor(35,35,35);
  doc.text(String(t),x,y,{align:"right"});
}
function calcRow(doc,label,value,y,fill=false){
  if(fill){
    doc.setFillColor(247,247,247);
    doc.rect(20,y-7,170,11,"F");
  }
  text(doc,label,26,y,9,false);
  rightText(doc,value,184,y,9,true);
}

$("form").addEventListener("submit",function(e){
  e.preventDefault();

  const gross=Number(val("gross"));
  const hours=Math.max(0,Number(val("hours"))||0);
  const minutes=Math.min(59,Math.max(0,Number(val("minutes"))||0));

  if(!Number.isFinite(gross)||gross<=0){
    $("status").textContent="Please enter a valid gross salary.";
    $("status").style.color="#b00020";
    return;
  }

  const totalHours=hours+(minutes/60);
  const hourly=gross/150;
  const holiday=val("type")==="holiday";

  const firstHours=Math.min(totalHours,1);
  const remainingHours=Math.max(totalHours-1,0);
  const firstRate=holiday?2:1.5;
  const remainingRate=holiday?2:1.7;

  const firstAmount=hourly*firstHours*firstRate;
  const remainingAmount=hourly*remainingHours*remainingRate;
  const total=firstAmount+remainingAmount;

  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:"portrait",unit:"mm",format:"a4"});
  const PW=210;

  // Header
  doc.setFillColor(139,16,40);
  doc.rect(0,0,PW,16,"F");
  doc.setFont("helvetica","bold");
  doc.setFontSize(12);
  doc.setTextColor(255,255,255);
  const reportTitle="OVERTIME PAYMENT CALCULATION";
  doc.text(reportTitle,PW/2,10,{align:"center"});

  doc.setFont("helvetica","bold");
  doc.setFontSize(8);
  doc.setTextColor(35,35,35);
  doc.text("ASK UNION - SBISA UDAIPUR MODULE",PW/2,23,{align:"center"});

  // Employee section
  text(doc,"EMPLOYEE DETAILS",20,34,10,true);
  doc.setLineWidth(.35);
  doc.line(20,38,190,38);

  text(doc,"Name:",20,47); text(doc,val("name"),48,47);
  text(doc,"PF No.:",112,47); text(doc,val("pf"),143,47);

  text(doc,"Branch:",20,56); text(doc,val("branch"),48,56);
  text(doc,"Branch Code:",112,56); text(doc,val("branchCode"),150,56);

  text(doc,"Date:",20,65); text(doc,dateDMY(),48,65);
  text(doc,"Day:",112,65); text(doc,val("day"),143,65);

  // Calculation heading
  text(doc,"OVERTIME CALCULATION",20,78,10,true);
  doc.line(20,82,190,82);

  // Clean tabular calculation
  const tx=20, ty=88, tw=170, labelW=108, valueW=62, rh=11;
  doc.setDrawColor(190,190,190);
  doc.setLineWidth(.25);
  doc.rect(tx,ty,tw,rh*8);
  doc.line(tx+labelW,ty,tx+labelW,ty+rh*8);

  const tableRows=[
    ["Gross Salary","Rs. "+money(gross)],
    ["Hourly Salary (Gross ÷ 150)","Rs. "+money(hourly)],
    ["OT Type",holiday?"Sunday / Holiday":"Week Day - After Business Hours"],
    ["OT Time",hours+" Hour(s) "+minutes+" Minute(s)"],
    ["First Hour / Rate",firstHours.toFixed(2)+" hr × "+(firstRate*100)+"%"],
    ["First Hour Amount","Rs. "+money(firstAmount)],
    ["Remaining Time / Rate",remainingHours.toFixed(2)+" hr × "+(remainingRate*100)+"%"],
    ["Remaining Amount","Rs. "+money(remainingAmount)]
  ];

  tableRows.forEach((r,i)=>{
    const yy=ty+i*rh;
    if(i%2===0){
      doc.setFillColor(248,248,248);
      doc.rect(tx,yy,tw,rh,"F");
    }
    if(i>0) doc.line(tx,yy,tx+tw,yy);
    text(doc,r[0],tx+6,yy+7.2,8.7,false);
    rightText(doc,r[1],tx+tw-6,yy+7.2,8.7,true);
  });

  // Total block
  doc.setFillColor(139,16,40);
  doc.roundedRect(20,180,170,19,3,3,"F");
  doc.setFont("helvetica","bold");
  doc.setFontSize(10.5);
  doc.setTextColor(255,255,255);
  doc.text("TOTAL OVERTIME AMOUNT",27,192);
  doc.text("Rs. "+money(total),183,192,{align:"right"});

  // Basis
  text(doc,"Calculation Basis",20,214,9,true);
  text(doc,"Hourly Salary = Gross Salary ÷ 150.",20,222,8);
  text(doc,"Week Day: first 1 hour at 150% and remaining hours at 170%.",20,229,8);
  text(doc,"Sunday/Holiday: 200% of hourly salary for all overtime hours.",20,236,8);

  doc.setLineWidth(.25);
  doc.line(20,268,190,268);
  text(doc,"Prepared By: SBISA UDAIPUR MODULE",20,278,8,true);
  rightText(doc,"ASK UNION",190,278,8,true);

  const safe=(val("name")||"Employee").replace(/[^a-z0-9]+/gi,"_");
  const datePart=val("date")||"date";
  doc.save("Overtime_Final_"+safe+"_"+datePart+".pdf");

  $("status").textContent="PDF generated successfully.";
  $("status").style.color="#176b35";
});
</script>
</body>
</html>
