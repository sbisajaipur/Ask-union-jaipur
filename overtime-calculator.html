 
  <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Overtime Calculator</title>

<!-- PDF Libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f7fb;
    color:#172554;
    padding:12px;
}

.container{
    width:100%;
    max-width:600px;
    margin:auto;
}

/* ================= HEADER ================= */

.header{
    background:linear-gradient(135deg,#0878d1,#07519b);
    color:#fff;
    border-radius:22px;
    padding:25px 18px;
    text-align:center;
    box-shadow:0 8px 25px rgba(0,80,160,.20);
    margin-bottom:15px;
}

.header-icon{
    font-size:42px;
    margin-bottom:5px;
}

.header h1{
    font-size:26px;
    font-weight:900;
    letter-spacing:.4px;
}

.header p{
    font-size:13px;
    margin-top:7px;
    opacity:.92;
}

/* ================= CARD ================= */

.card{
    background:#fff;
    border-radius:20px;
    padding:20px;
    margin-bottom:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.07);
}

.card-title{
    font-size:18px;
    font-weight:800;
    margin-bottom:18px;
    color:#102a56;
}

/* ================= INPUT ================= */

.field{
    margin-bottom:15px;
}

.field label{
    display:block;
    font-size:13px;
    font-weight:700;
    color:#536176;
    margin-bottom:7px;
}

.field input,
.field select{
    width:100%;
    height:52px;
    border:1px solid #d7e0eb;
    border-radius:13px;
    background:#f9fbfd;
    padding:0 14px;
    font-size:16px;
    color:#172554;
    outline:none;
}

.field input:focus,
.field select:focus{
    border-color:#0878d1;
    background:#fff;
    box-shadow:0 0 0 3px rgba(8,120,209,.10);
}

/* ================= BUTTON ================= */

.calculate-btn{
    width:100%;
    height:56px;
    border:none;
    border-radius:14px;
    background:linear-gradient(135deg,#0878d1,#07519b);
    color:#fff;
    font-size:16px;
    font-weight:900;
    cursor:pointer;
    margin-top:5px;
    box-shadow:0 7px 18px rgba(8,120,209,.25);
}

.calculate-btn:active{
    transform:scale(.98);
}

/* ================= RESULT ================= */

.result-card{
    display:none;
    background:linear-gradient(135deg,#f0fff7,#ffffff);
    border:1px solid #d5f2df;
}

.result-heading{
    color:#08744a;
    font-size:18px;
    font-weight:900;
    margin-bottom:14px;
}

.total-box{
    text-align:center;
    background:#e8fff1;
    border-radius:17px;
    padding:20px 10px;
    border:1px solid #cef0dc;
    margin-bottom:15px;
}

.total-label{
    color:#607080;
    font-size:13px;
    font-weight:700;
}

.total-amount{
    color:#0878d1;
    font-size:38px;
    font-weight:900;
    margin:5px 0;
}

.total-sub{
    color:#637083;
    font-size:12px;
}

/* ================= DETAILS ================= */

.details{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.detail{
    background:#fff;
    border:1px solid #e0e7ef;
    border-radius:13px;
    padding:12px 7px;
    text-align:center;
}

.detail span{
    display:block;
    color:#718096;
    font-size:10px;
    margin-bottom:5px;
}

.detail strong{
    display:block;
    color:#172554;
    font-size:13px;
}

/* ================= SHARE ================= */

.share-btn{
    width:100%;
    height:53px;
    border:0;
    border-radius:14px;
    background:#168c4a;
    color:#fff;
    font-size:15px;
    font-weight:900;
    cursor:pointer;
    margin-top:15px;
}

.share-btn:active{
    transform:scale(.98);
}

.reset-btn{
    width:100%;
    height:48px;
    border:1px solid #cdd8e5;
    border-radius:13px;
    background:#fff;
    color:#1769aa;
    font-weight:800;
    margin-top:10px;
    cursor:pointer;
}

/* ================= INFO ================= */

.info{
    font-size:12px;
    color:#64748b;
    line-height:1.6;
}

.info strong{
    color:#26364d;
}

/* ================= PDF ONLY ================= */

.pdf-header{
    display:none;
}

/* ================= FOOTER ================= */

.footer{
    text-align:center;
    color:#8794a6;
    font-size:11px;
    padding:5px 0 10px;
}

/* ================= MOBILE ================= */

@media(max-width:400px){

    body{
        padding:8px;
    }

    .header{
        padding:21px 13px;
    }

    .header h1{
        font-size:22px;
    }

    .card{
        padding:16px;
    }

    .details{
        grid-template-columns:1fr 1fr;
    }

    .total-amount{
        font-size:34px;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- HEADER -->
    <div class="header">

        <div class="header-icon">
            ⏱️
        </div>

        <h1>OVERTIME CALCULATOR</h1>

        <p>
            Staff Overtime Calculation • 2026
        </p>

    </div>


    <!-- INPUT CARD -->
    <div class="card">

        <div class="card-title">
            📋 Enter Details
        </div>

        <!-- MONTH -->
        <div class="field">

            <label>Select Month</label>

            <select id="month">

                <option>January 2026</option>
                <option>February 2026</option>
                <option>March 2026</option>
                <option>April 2026</option>
                <option>May 2026</option>
                <option>June 2026</option>
                <option>July 2026</option>
                <option>August 2026</option>
                <option>September 2026</option>

                <option selected>
                    October 2026
                </option>

                <option>November 2026</option>
                <option>December 2026</option>

            </select>

        </div>


        <!-- BASIC PAY -->
        <div class="field">

            <label>
                Basic Pay / Eligible Pay (₹)
            </label>

            <input
                type="number"
                id="basicPay"
                placeholder="Enter amount"
                inputmode="numeric"
            >

        </div>


        <!-- HOURS -->
        <div class="field">

            <label>
                Overtime Hours
            </label>

            <input
                type="number"
                id="otHours"
                placeholder="Enter overtime hours"
                inputmode="decimal"
            >

        </div>


        <!-- RATE -->
        <div class="field">

            <label>
                Overtime Rate per Hour (₹)
            </label>

            <input
                type="number"
                id="otRate"
                placeholder="Enter hourly rate"
                inputmode="decimal"
            >

        </div>


        <button
            class="calculate-btn"
            onclick="calculateOvertime()"
        >
            🧮 CALCULATE OVERTIME
        </button>

    </div>


    <!-- RESULT CARD -->
    <div
        class="card result-card"
        id="resultCard"
    >

        <div class="result-heading">
            ✅ YOUR RESULT
        </div>


        <!-- TOTAL -->
        <div class="total-box">

            <div class="total-label">
                ESTIMATED OVERTIME AMOUNT
            </div>

            <div
                class="total-amount"
                id="totalAmount"
            >
                ₹ 0
            </div>

            <div class="total-sub">
                Based on the entered overtime details
            </div>

        </div>


        <!-- DETAILS -->
        <div class="details">

            <div class="detail">

                <span>MONTH</span>

                <strong id="resultMonth">
                    -
                </strong>

            </div>


            <div class="detail">

                <
