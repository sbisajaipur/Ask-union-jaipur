<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Overtime Calculator | Ask Union</title>

<!-- PDF Libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:linear-gradient(135deg,#eef4ff,#f8fbff);
    color:#172033;
}

.container{
    width:100%;
    max-width:650px;
    margin:auto;
    padding:18px;
}

.header{
    background:linear-gradient(135deg,#063b91,#1261d6);
    color:white;
    padding:24px 18px;
    border-radius:22px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
    margin-bottom:18px;
}

.header h1{
    margin:0;
    font-size:26px;
}

.header p{
    margin:8px 0 0;
    opacity:.9;
    font-size:14px;
}

.card{
    background:white;
    border-radius:20px;
    padding:20px;
    box-shadow:0 8px 25px rgba(0,0,0,.08);
    margin-bottom:18px;
}

label{
    display:block;
    font-size:14px;
    font-weight:bold;
    margin-bottom:7px;
    color:#303b50;
}

input,select{
    width:100%;
    padding:13px 14px;
    border:1px solid #d7deea;
    border-radius:12px;
    font-size:15px;
    outline:none;
    background:#fff;
    margin-bottom:15px;
}

input:focus,select:focus{
    border-color:#1261d6;
    box-shadow:0 0 0 3px rgba(18,97,214,.10);
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

button{
    width:100%;
    border:none;
    padding:14px;
    border-radius:13px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-top:5px;
}

.calculate{
    background:linear-gradient(135deg,#0b63d8,#0847a6);
    color:white;
}

.reset{
    background:#edf1f7;
    color:#263247;
    margin-top:10px;
}

.share{
    background:#19a957;
    color:white;
    margin-top:10px;
}

.result{
    display:none;
    background:#f7fbff;
    border:1px solid #dbe9ff;
    border-radius:18px;
    padding:18px;
}

.result h2{
    margin-top:0;
    color:#084da8;
    font-size:21px;
}

.result-row{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:9px 0;
    border-bottom:1px solid #e5eaf1;
    font-size:14px;
}

.result-row:last-child{
    border-bottom:none;
}

.result-row span:last-child{
    font-weight:bold;
    text-align:right;
}

.total{
    background:#e8f7ee;
    border-radius:13px;
    padding:15px;
    margin-top:14px;
    text-align:center;
}

.total small{
    display:block;
    color:#237044;
    font-weight:bold;
}

.total strong{
    display:block;
    color:#087a3e;
    font-size:29px;
    margin-top:5px;
}

.formula{
    background:#fff8e7;
    border-left:4px solid #f0a500;
    padding:12px;
    border-radius:10px;
    margin-top:15px;
    font-size:13px;
    line-height:1.5;
}

.footer{
    text-align:center;
    font-size:11px;
    color:#7a8495;
    margin:20px 0 8px;
}

/* PDF result */
#pdfArea{
    background:white;
    padding:25px;
    width:700px;
    position:absolute;
    left:-99999px;
    top:0;
}

.pdf-title{
    text-align:center;
    color:#084da8;
    margin-bottom:20px;
}

.pdf-box{
    border:1px solid #ddd;
    border-radius:12px;
    padding:15px;
}

.pdf-row{
    display:flex;
    justify-content:space-between;
    padding:9px 0;
    border-bottom:1px solid #eee;
}

.pdf-total{
    margin-top:18px;
    background:#e8f7ee;
    padding:18px;
    text-align:center;
    border-radius:12px;
}

.pdf-total strong{
    display:block;
    font-size:28px;
    color:#087a3e;
    margin-top:5px;
}

.pdf-footer{
    text-align:center;
    margin-top:25px;
    font-size:11px;
    color:#777;
}

@media(max-width:520px){
    .container{
        padding:12px;
    }

    .grid{
        grid-template-columns:1fr;
        gap:0;
    }

    .header{
        padding:20px 15px;
    }

    .header h1{
        font-size:23px;
    }

    .card{
        padding:16px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Overtime Calculator</h1>
        <p>Quick & Accurate Overtime Calculation</p>
    </div>

    <div class="card">

        <div class="grid">

            <div>
                <label>Employee Name</label>
                <input type="text" id="employeeName" placeholder="Enter employee name">
            </div>

            <div>
                <label>Employee Code</label>
                <input type="text" id="employeeCode" placeholder="Employee code">
            </div>

        </div>

        <div class="grid">

            <div>
                <label>Branch Code</label>
                <
