<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASK UNION - Overtime Calculator</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#eef2f7;
  color:#222;
  font-family:Arial,Helvetica,sans-serif;
}

.container{
  max-width:760px;
  margin:auto;
  padding:18px;
}

.header{
  background:linear-gradient(135deg,#0b4ea2,#1769c2);
  color:#fff;
  border-radius:20px;
  padding:25px 30px;
  margin-bottom:18px;
  position:relative;
}

.header h1{
  margin:0;
  font-size:29px;
  line-height:1.2;
}

.header p{
  margin:8px 0 0;
  font-size:16px;
}

.brand{
  position:absolute;
  right:28px;
  top:28px;
  font-weight:800;
  font-size:15px;
}

.card{
  background:#fff;
  border-radius:18px;
  padding:24px;
  margin-bottom:18px;
  box-shadow:0 3px 14px rgba(0,0,0,.08);
}

.card h2{
  color:#14589f;
  font-size:22px;
  margin:0 0 18px;
  padding-bottom:10px;
  border-bottom:1px solid #ddd;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

label{
  display:block;
  font-weight:700;
  font-size:15px;
  margin-bottom:7px;
}

input,select{
  width:100%;
  height:52px;
  padding:12px 14px;
  border:1px solid #c8cdd4;
  border-radius:11px;
  font-size:16px;
  background:#fff;
  color:#222;
}

.actions{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

button{
  border:0;
  border-radius:11px;
  padding:14px 20px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.calculate{
  background:#0b4ea2;
  color:white;
}

.pdf{
  background:#168447;
  color:white;
  display:none;
}

.reset{
  background:#e5e7eb;
  color:#222;
}

.error{
  color:#b00020;
  font-weight:700;
  margin-top:12px;
}

.result{
  display:none;
}

.result-title{
  color:#14589f;
  font-size:22px;
  font-weight:800;
  margin-bottom:15px;
  border-bottom:1px solid #ddd;
  padding-bottom:10px;
}

.table{
  border:1px solid #d0d5db;
  border-radius:10px;
  overflow:hidden;
}

.row{
  display:grid;
  grid-template-columns:55% 45%;
  border-bottom:1px solid #d0d5db;
}

.row:last-child{
  border-bottom:0;
}

.cell{
  padding:13px 15px;
  font-size:15px;
}

.row:nth-child(odd){
  background:#f7f9fc;
}

.value{
  text-align:right;
  font-weight:700;
}

.total{
  margin-top:15px;
  background:#0b4ea2;
  color:white;
  border-radius:12px;
  padding:17px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-weight:800;
  font-size:17px;
}

.total .amount{
  font-size:22px;
}

.note{
  font-size:12px;
  color:#666;
  margin-top:10px;
}

@media(max-width:620px){

  .container{
    padding:14px;
  }

  .header{
    padding:24px 20px;
  }

  .header h1{
    font-size:27px;
    padding-right:70px;
  }

  .brand{
    right:20px;
    top:25px;
    font-size:13px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .card{
    padding:20px;
  }

  .row{
    grid-template-columns:52% 48%;
  }

  .cell{
    padding:12px 10px;
    font-size:14px;
  }

  .total{
    font-size:14px;
  }

  .total .amount{
    font-size:19px;
  }
}

    margin:12mm;
  }

  body{
    background:#fff;
  }

  .container{
    max-width:none;
    padding:0;
  }

  .header{
    box-shadow:none;
    margin-bottom:12px;
  }

  .form-card,
  .actions,

  }

  .result{
    display:block !important;
  }

  .card{
    box-shadow:none;
    margin:0 0 12px;
    padding:10px;
  }

  .result-title{
    font-size:18px
