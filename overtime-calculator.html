<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASK UNION - Overtime Calculator</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#eef2f7;
  color:#172033;
  font-family:Arial,Helvetica,sans-serif;
}

.container{
  max-width:820px;
  margin:auto;
  padding:16px;
}

/* HEADER */

.header{
  background:linear-gradient(135deg,#073f91,#0b63c7);
  color:#fff;
  border-radius:18px;
  padding:24px 28px;
  margin-bottom:16px;
  position:relative;
}

.header h1{
  margin:0;
  font-size:28px;
  line-height:1.15;
}

.header p{
  margin:8px 0 0;
  font-size:15px;
}

.brand{
  position:absolute;
  right:25px;
  top:27px;
  font-weight:800;
  font-size:14px;
}


/* FORM CARDS */

.card{
  background:#fff;
  border-radius:16px;
  padding:20px;
  margin-bottom:16px;
  box-shadow:0 3px 14px rgba(0,0,0,.08);
}

.card h2{
  margin:0 0 16px;
  color:#14589f;
  font-size:20px;
  border-bottom:1px solid #d7dde5;
  padding-bottom:9px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

label{
  display:block;
  font-weight:700;
  font-size:14px;
  margin-bottom:6px;
}

input,
select{
  width:100%;
  height:50px;
  border:1px solid #c8cfd8;
  border-radius:9px;
  padding:10px 12px;
  font-size:16px;
  background:#fff;
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

button{
  border:0;
  border-radius:9px;
  padding:13px 18px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
}

.calculate{
  background:#0b4ea2;
  color:#fff;
}

.pdf{
  background:#168447;
  color:#fff;
  display:none;
}

.reset{
  background:#e5e7eb;
  color:#222;
}

.error{
  color:#b00020;
  font-weight:700;
  margin-top:10px;
}


/* RESULT */

.result{
  display:none;
}


/* EMPLOYEE DETAILS */

.employee-box{
  border:1px solid #b8d2ef;
  border-radius:12px;
  overflow:hidden;
  margin-bottom:16px;
}

.employee-title{
  background:#eaf4ff;
  color:#14589f;
  font-size:17px;
  font-weight:800;
  padding:12px 15px;
}

.employee-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
}

.ed-row{
  display:grid;
  grid-template-columns:42% 58%;
  padding:10px 13px;
  border-top:1px solid #e0e5eb;
  font-size:13px;
}

.ed-row:nth-child(odd){
  background:#fafcff;
}

.ed-label{
  font-weight:700;
  color:#4b5563;
}

.ed-value{
  font-weight:700;
}


/* OVERTIME TABLE */

.calc-title{
  background:#0b4ea2;
  color:#fff;
  border-radius:10px 10px 0 0;
  padding:12px 15px;
  font-size:17px;
  font-weight:800;
}

.calc-table{
  border:1px solid #c9d3df;
  border-top:0;
  border-radius:0 0 10px 10px;
  overflow:hidden;
}

.row{
  display:grid;
  grid-template-columns:55% 45%;
  border-bottom:1px solid #d3dbe5;
}

.row:last-child{
  border-bottom:0;
}

.cell{
  padding:11px 13px;
  font-size:13px;
}

.row:nth-child(odd){
  background:#f5f9fe;
}

.value{
  text-align:right;
  font-weight:700;
}


/* TOTAL */

.total{
  margin-top:12px;
  background:#0b4ea2;
  color:#fff;
  border-radius:10px
