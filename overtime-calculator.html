<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Overtime Calculator | Ask Union</title>

<style>

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f7fd;
    color:#344054;
}

.container{
    width:100%;
    max-width:680px;
    margin:0 auto;
    padding:20px;
}

/* HEADER */

.header{
    background:linear-gradient(135deg,#1247a6,#176bd4);
    color:#fff;
    text-align:center;
    padding:28px 15px;
    border-radius:28px;
    margin-bottom:25px;
    box-shadow:0 10px 25px rgba(18,71,166,.20);
}

.header h1{
    margin:0;
    font-size:32px;
    font-weight:700;
}

.header p{
    margin:10px 0 0;
    font-size:18px;
}

/* CARD */

.card{
    background:#fff;
    border-radius:28px;
    padding:27px;
    margin-bottom:20px;
    box-shadow:0 8px 25px rgba(0,0,0,.07);
}

/* LABEL */

label{
    display:block;
    font-size:17px;
    font-weight:700;
    margin-bottom:9px;
    color:#344054;
}

/* INPUT */

input,
select{
    width:100%;
    height:62px;
    border:1px solid #d5dbe5;
    border-radius:17px;
    padding:0 18px;
    font-size:18px;
    color:#222;
    background:#fff;
    margin-bottom:20px;
}

input:focus,
select:focus{
    outline:none;
    border:2px solid #176bd4;
    box-shadow:0 0 0 3px rgba(23,107,212,.10);
}

/* BUTTON */

button{
    width:100%;
    height:62px;
    border:0;
    border-radius:17px;
    font-size:18px;
    font-weight:700;
    cursor:pointer;
    font-family:Arial,sans-serif;
}

/* CALCULATE */

.calculate-btn{
    background:linear-gradient(135deg,#087bd0,#0759a8);
    color:#fff;
    box-shadow:0 7px 15px rgba(8,123,208,.20);
}

.calculate-btn:active{
    transform:scale(.99);
}

/* RESET */

.reset-btn{
    margin-top:12px;
    background:#edf1f6;
    color:#333;
}

/* RESULT */

.result{
    display:none;
}

.result h2{
    margin:0 0 18px;
    color:#123f88;
    font-size:23px;
}

/* RESULT ROW */

.row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    padding:12px 0;
    border-bottom:1px solid #e5e7eb;
    font-size:16px;
}

.row span:first-child{
    color:#667085;
}

.row strong{
    color:#1d2939;
    text-align:right;
}

/* TOTAL */

.total{
    margin-top:20px;
    padding:20px;
    background:#e8f7ee;
    border-radius:18px;
    text-align:center;
}

.total small{
    display:block;
    color:#247344;
    font-size:13px;
    font-weight:700;
}

.total h2{
    margin:7px 0 0;
    color:#087a3e;
    font-size:32px;
}

/* SHARE */

.share-btn{
    margin-top:15px;
    background:#16a34a;
    color:#fff;
}

/* PDF */

.pdf-btn{
    margin-top:12px;
    background:#123f88;
    color:#fff;
}

/* INFO */

.info{
    color:#667085;
    line-height:1.7;
}

.info h3{
    color:#344054;
    margin-top:0;
}

.formula-box{
    background:#f7f9fc;
    border-left:4px solid #176bd4;
    border-radius:8px;
    padding:13px;
    margin-top:12px;
}

/* FOOTER */

.footer{
    text-align:center;
    color:#8a94a6;
    font-size:12px;
    line-height:1.6;
    padding:8px 0 20px;
}

/* MOBILE */

@media(max-width:500px){

    .container{
        padding:15px;
    }

    .header{
        padding:25px 12px;
        border-radius:25px;
    }

    .header h1{
        font-size:29px;
    }

    .header p{
        font-size:17px;
    }

    .card{
        padding:24px;
        border-radius:25px;
    }

    input,
    select{
        font-size:17px;
    }

}

</style>
</head>


<body>

<div class="container">


<!-- HEADER -->

<div class="header">

    <h1>Overtime Calculator</h1>

    <p>Quick & Accurate Overtime Calculation</p>

</div>


<!-- INPUT CARD -->

<div class="card">

    <label for="employeeName">
        Employee Name
    </label>

    <input
        id="employeeName"
        type="text"
        placeholder="Enter employee name"
    >


    <label for="employeeCode">
        Employee Code
    </label>

    <input
        id="employeeCode"
        type="text"
        placeholder="Employee code"
    >


    <label for="branchCode">
        Branch Code
    </label>

    <input
        id="branchCode"
        type="text"
        value="32146"
    >


    <label for="otDate">
        Date of Overtime
    </label>

    <input
        id="otDate"
        type="date"
    >


    <label for="month">
        Select Month
    </label>

    <select id="month">

        <option value="">
            Select Month
        </option>

        <option value="January 2026">
            January 2026
        </option>

        <option value="February 2026">
            February 2026
        </option>

        <option value="March 2026">
            March 2026
        </option>

        <option value="April 2026">
            April 2026
        </option>

        <option value="May 2026">
            May 2026
        </option>

        <option value="June 2026">
            June 2026
        </option>

        <option value="July 2026">
            July 2026
        </option>

        <option value="August 2026">
            August 2026
        </option>

        <option value="September 2026">
            September 2026
        </option>

        <option value="October 2026">
            October 2026
        </option>

        <option value="November 2026">
            November 2026
        </option>

        <option value="December 2026">
            December 2026
        </option>

    </select>


    <label for="grossPay">
        Gross Pay (₹)
    </label>

    <input
        id="grossPay"
        type="number"
        min="0"
        step="0.01"
        placeholder="Enter Gross Pay"
    >


    <label for="otType">
        Overtime Type
    </label>

    <select id="otType">

        <option value="">
            Select Overtime Type
        </option>

        <option value="weekday">
            Weekday
        </option>

        <option value="holiday">
            Sunday / Holiday
        </option>

    </select>


    <label for="otHours">
        Overtime Hours
    </label>

    <input
        id="otHours"
        type="number"
        min="0"
        step="0.5"
        placeholder="Example: 6.5"
    >


    <button
        type="button"
        id="calculateBtn"
        class="calculate-btn"
    >
        🧮 CALCULATE OVERTIME
    </button>


    <button
        type="button"
        id="resetBtn"
        class="reset-btn"
    >
        RESET
    </button>

</div>


<!-- RESULT CARD -->
