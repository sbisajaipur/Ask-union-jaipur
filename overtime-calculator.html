<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SBISA Overtime Calculator</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f1f3f6;
  font-family:Arial,Helvetica,sans-serif;
  color:#222;
}

.container{
  max-width:780px;
  margin:auto;
  padding:16px;
}

.header{
  background:#0b4ea2;
  color:#fff;
  padding:18px 20px;
  border-radius:14px;
  margin-bottom:14px;
}

.header h1{
  margin:0;
  font-size:22px;
}

.header p{
  margin:5px 0 0;
  font-size:12px;
}

.brand{
  float:right;
  font-weight:800;
  font-size:12px;
  letter-spacing:.5px;
  margin-top:2px;
}

.card{
  background:#fff;
  border-radius:14px;
  padding:18px;
  margin-bottom:14px;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.card h2{
  margin:0 0 14px;
  color:#0b4ea2;
  font-size:16px;
  border-bottom:1px solid #ddd;
  padding-bottom:8px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.full{
  grid-column:1/-1;
}

label{
  display:block;
  font-size:12px;
  font-weight:700;
  margin-bottom:5px;
}

input,
select{
  width:100%;
  padding:11px;
  border:1px solid #cbd0d7;
  border-radius:8px;
  font-size:15px;
  background:#fff;
}

.buttons{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

button{
  border:0;
  border-radius:8px;
  padding:12px 18px;
  font-weight:700;
  cursor:pointer;
}

.primary{
  background:#0b4ea2;
  color:#fff;
}

.secondary{
  background:#e8e8e8;
}

#status{
  font-size:12px;
  margin-top:10px;
}

@media(max-width:620px){
  .grid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="brand">ASK UNION</div>

    <h1>🧮 Overtime Payment Calculation</h1>

    <p>SBISA UDAIPUR MODULE</p>
  </div>


  <form id="form">

    <!-- EMPLOYEE DETAILS -->
    <div class="card">

      <h2>Employee Details</h2>

      <div class="grid">

        <div>
          <label>Employee Name *</label>
          <input id="name" required>
        </div>

        <div>
          <label>PF No. *</label>
          <input id="pf" required>
        </div>

        <div>
          <label>Branch Name *</label>
          <input id="branch" required>
        </div>

        <div>
          <label>Branch Code *</label>
          <input id="branchCode" required>
        </div>

        <div>
          <label>Date *</label>
          <input id="date" type="date" required>
        </div>

        <div>
          <label>Day *</label>

          <select id="day">
            <option>Monday</option>
            <option>Tuesday</option>
            <option>Wednesday</option>
            <option>Thursday</option>
            <option>Friday</option>
            <option>Saturday</option>
            <option>Sunday</option>
            <option>Holiday</option>
          </select>

        </div>

      </div>

    </div>


    <!-- OVERTIME DETAILS -->
    <div class="card">

      <h2>Overtime Details</h2>

      <div class="grid">

        <div>
          <label>Gross Salary *</label>
          <input
            id="gross"
            type="number"
            min="0"
            step="0.01"
            required
          >
        </div>


        <div>

          <label>OT Type *</label>

          <select id="type">

            <option value="weekday">
              Week Day - After Business Hours
            </option>

            <option value="holiday">
              Sunday / Holiday
            </option>

          </select>

        </div>


        <div>

          <label>OT Hours *</label>

          <input
            id="hours"
            type="number"
            min="0"
            step="1"
            value="0"
            required
          >

        </div>


        <div>

          <label>OT Minutes *</label>

          <input
            id="minutes"
            type="number"
            min="0"
            max="59"
            step="1"
            value="0"
            required
          >

        </div>

      </div>

    </div>


    <!-- BUTTONS -->
    <div class="card">

      <div class="buttons">

        <button
          class="primary"
          type="submit"
        >
          Calculate & Generate PDF
        </button>


        <button
          class="secondary"
          type="reset"
        >
          Reset
        </button>

      </div>

      <div id="status"></div>

    </div>

  </form>

</div>


<!-- jsPDF -->

    x,
    y,
    {
      align:"right"
    }
  );

}
