<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>ASK UNION – Admin Panel</title>

<style>

/* =========================
   ASK UNION ADMIN PANEL
   PREMIUM MOBILE DESIGN
========================= */

:root{
  --maroon:#7b1024;
  --maroon-dark:#5f0c1c;
  --cream:#faf7f4;
  --text:#292929;
  --muted:#777;
  --border:#eadde0;
  --white:#ffffff;
  --green:#178a55;
  --red:#d93025;
  --orange:#e39a00;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:
    linear-gradient(
      rgba(250,247,244,.94),
      rgba(250,247,244,.97)
    );

  color:var(--text);
  padding:18px 12px 40px;
}


/* =========================
   MAIN CONTAINER
========================= */

.box{
  width:100%;
  max-width:700px;
  margin:0 auto 18px;

  background:rgba(255,255,255,.97);

  border:1px solid var(--border);

  border-radius:24px;

  padding:22px;

  box-shadow:
    0 12px 35px rgba(80,20,35,.09);
}


/* =========================
   BRAND
========================= */

.brand{
  text-align:center;
  padding:8px 0 18px;
}

.brand-icon{
  width:58px;
  height:58px;

  margin:0 auto 12px;

  border-radius:18px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:var(--maroon);
  color:white;

  font-size:27px;
  font-weight:bold;

  box-shadow:
    0 8px 20px rgba(123,16,36,.20);
}

.brand h1{
  margin:0;

  font-size:28px;

  color:var(--maroon);

  letter-spacing:.4px;
}

.brand p{
  margin:7px 0 0;

  color:var(--muted);

  font-size:13px;

  font-weight:600;

  letter-spacing:.5px;
}


/* =========================
   HEADINGS
========================= */

h2{
  margin:0 0 15px;

  color:var(--maroon);

  font-size:21px;
}

.section-title{
  display:flex;
  align-items:center;
  gap:10px;

  margin-bottom:16px;
}

.section-icon{
  width:38px;
  height:38px;

  border-radius:12px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#f4e9ec;

  font-size:18px;
}


/* =========================
   LOGIN
========================= */

.login-subtitle{
  text-align:center;

  color:var(--muted);

  margin:0 0 18px;

  font-size:14px;
}


/* =========================
   INPUTS
========================= */

label{
  display:block;

  margin:14px 0 6px;

  font-size:13px;

  font-weight:700;

  color:#555;
}

input,
textarea,
select{
  width:100%;

  border:1px solid #dcd3d5;

  border-radius:14px;

  padding:14px;

  background:#fff;

  color:#222;

  font-size:16px;

  outline:none;

  transition:
    border-color .2s ease,
    box-shadow .2s ease;
}

input:focus,
textarea:focus,
select:focus{
  border-color:var(--maroon);

  box-shadow:
    0 0 0 3px rgba(123,16,36,.08);
}

textarea{
  min-height:130px;

  resize:vertical;
}


/* =========================
   BUTTONS
========================= */

button{
  width:100%;

  border:0;

  border-radius:14px;

  padding:14px 16px;

  margin-top:10px;

  font-size:15px;

  font-weight:800;

  cursor:pointer;

  transition:
    transform .15s ease,
    opacity .15s ease;
}

button:active{
  transform:scale(.98);
}

.primary{
  background:var(--maroon);

  color:white;

  box-shadow:
    0 7px 18px rgba(123,16,36,.18);
}

.primary:hover{
  background:var(--maroon-dark);
}

.logout{
  background:#eeeeee;

  color:#444;
}

.edit{
  background:#fff2d6;

  color:#946100;
}

.delete{
  background:#fde9e7;

  color:#b42318;
}


/* =========================
   ADMIN HEADER
========================= */

.admin-header{
  display:flex;

  justify-content:space-between;
  align-items:flex-start;

  gap:12px;

  margin-bottom:18px;
}

.admin-title{
  margin:0;

  font-size:23px;

  color:var(--maroon);
}

.admin-email{
  display:block;

  margin-top:5px;

  color:var(--muted);

  font-size:12px;

  word-break:break-word;
}

.admin-header .logout{
  width:auto;

  margin:0;

  padding:10px 14px;

  font-size:12px;
}


/* =========================
   TYPE SELECTOR
========================= */

.type-note{
  padding:12px 14px;

  margin-bottom:14px;

  border-radius:13px;

  background:#faf3f5;

  color:#6e2838;

  font-size:12px;

  line-height:1.5;
}


/* =========================
   DATE ROW
========================= */

.date-row{
  display:grid;

  grid-template-columns:1fr 1fr;

  gap:10px;
}


/* =========================
   MESSAGE
========================= */

.message{
  display:none;

  margin-top:14px;

  padding:12px 14px;

  border-radius:12px;

  background:#eaf7f0;

  color:#126b42;

  font-size:13px;

  font-weight:700;
}

.message.show{
  display:block;
}


/* =========================
   DIVIDER
========================= */

hr{
  border:0;

  border-top:1px solid #eee;

  margin:25px 0;
}


/* =========================
   PUBLISHED CONTENT
========================= */

.content-toolbar{
  margin-bottom:15px;
}

.item{
  position:relative;

  margin:14px 0;

  padding:18px;

  border:1px solid var(--border);

  border-left:4px solid var(--maroon);

  border-radius:17px;

  background:#fff;

  box-shadow:
    0 6px 18px rgba(50,20,30,.06);
}

.item-title{
  font-size:17px;

  line-height:1.4;

  font-weight:800;

  color:var(--maroon);

  margin-bottom:8px;
}

.item-date{
  display:inline-block;

  padding:5px 9px;

  border-radius:20px;

  background:#f4e9ec;

  color:var(--maroon);

  font-size:11px;

  font-weight:800;

  margin-bottom:9px;
}

.item-details{
  margin:7px 0 12px;

  color:#555;

  font-size:14px;

  line-height:1.6;

  white-space:pre-wrap;
}

.item-link{
  display:inline-block;

  margin-bottom:10px;

  color:var(--maroon);

  font-size:13px;

  font-weight:700;

  text-decoration:none;
}

.item-actions{
  display:grid;

  grid-template-columns:1fr 1fr;

  gap:9px;

  margin-top:8px;
}

.item-actions button{
  margin:0;

  padding:11px;

  font-size:12px;
}


/* =========================
   EMPTY / LOADING
========================= */

.status{
  padding:18px;

  text-align:center;

  color:var(--muted);

  font-size:14px;

  background:#fafafa;

  border-radius:14px;
}


/* =========================
   HIDDEN
========================= */

.hidden{
  display:none !important;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  body{
    padding:10px 8px 30px;
  }

  .box{
    padding:18px;

    border-radius:21px;
  }

  .brand h1{
    font-size:25px;
  }

  .admin-header{
    align-items:center;
  }

  .admin-title{
    font-size:20px;
  }

  .date-row{
    grid-template-columns:1fr;
  }

  input,
  textarea,
  select{
    font-size:16px;
  }

}


/* =========================
   DESKTOP
========================= */

@media(min-width:701px){

  .item-actions{
    max-width:280px;
  }

}

</style>

</head>


<body>


<!-- =========================
     LOGIN
========================= -->

<div
  class="box"
  id="loginBox">

  <div class="brand">

    <div class="brand-icon">
      AU
    </div>

    <h1>
      ASK UNION
    </h1>

    <p>
      SBISA UDAIPUR MODULE
    </p>

  </div>


  <p class="login-subtitle">
    Secure Union Admin Panel
  </p>


  <label>
    Admin Email
  </label>

  <input
    type="email"
    id="email"
    placeholder="Enter admin email"
    autocomplete="username">


  <label>
    Password
  </label>

  <input
    type="password"
    id="password"
    placeholder="Enter password"
    autocomplete="current-password">


  <button
    class="primary"
    onclick="login()">

    🔐 LOGIN

  </button>


  <div
    id="loginMessage"
    class="message">
  </div>

</div>



<!-- =========================
     ADMIN PANEL
========================= -->

<div
  class="box hidden"
  id="adminBox">


  <div class="admin-header">

    <div>

      <h1 class="admin-title">
        Admin Dashboard
      </h1>

      <span
        class="admin-email"
        id="adminEmail">
      </span>

    </div>

    <button
      class="logout"
      onclick="logout()">

      LOGOUT

    </button>

  </div>



  <!-- =====================
       PUBLISH
  ====================== -->

  <div class="section-title">

    <div class="section-icon">
      ✨
    </div>

    <h2>
      Publish Content
    </h2>

  </div>


  <div class="type-note">
    Select the content type and publish it directly to the public ASK UNION website.
  </div>


  <label>
    Content Type
  </label>

  <select id="type">

    <option value="updates">
      📰 Update / Notice
    </option>

    <option value="circulars">
      📄 Circular
    </option>

    <option value="events">
      📅 Event
    </option>

  </select>


  <label>
    Title
  </label>

  <input
    type="text"
    id="title"
    placeholder="Enter title">


  <label>
    Date
  </label>

  <input
    type="date"
    id="contentDate">


  <label>
    Details
  </label>

  <textarea
    id="details"
    placeholder="Enter details / announcement">
  </textarea>


  <label>
    PDF / Website Link
  </label>

  <input
    type="url"
    id="link"
    placeholder="https://...">


  <button
    id="publishButton"
    class="primary"
    onclick="publish()">

    🚀 PUBLISH

  </button>


  <button
    id="cancelButton"
    class="logout hidden"
    onclick="cancelEdit()">

    CANCEL EDIT

  </button>


  <div
    id="message"
    class="message">
  </div>



  <hr>



  <!-- =====================
       MANAGE
  ====================== -->

  <div class="section-title">

    <div class="section-icon">
      📚
    </div>

    <h2>
      Published Content
    </h2>

  </div>


  <div class="content-toolbar">

    <label>
      Manage
    </label>

    <select
      id="manageType"
      onchange="loadContent()">

      <option value="updates">
        📰 Updates / Notices
      </option>

      <option value="circulars">
        📄 Circulars
      </option>

      <option value="events">
        📅 Events
      </option>

    </select>

  </div>


  <div id="contentList">

    <div class="status">
      Loading...
    </div>

  </div>

</div>



<!-- =========================
     FIREBASE
========================= -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>


<script>


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyAzMEREwPKnifSIrB5Cva8D-CFbVIa5zF0",

  authDomain:
    "ask-union-jaipur-circle.firebaseapp.com",

  projectId:
    "ask-union-jaipur-circle",

  storageBucket:
    "ask-union-jaipur-circle.firebasestorage.app",

  messagingSenderId:
    "584327754977",

  appId:
    "1:584327754977:web:7164a85c007165743ef3a"

};


firebase.initializeApp(firebaseConfig);


const auth =
  firebase.auth();

const db =
  firebase.firestore();


let editingId = null;



/* =========================
   LOGIN
========================= */

function login(){

  const email =
    document
      .getElementById("email")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;


  if(!email || !password){

    showLoginMessage(
      "Please enter email and password."
    );

    return;
  }


  auth
    .signInWithEmailAndPassword(
      email,
      password
    )

    .catch(error => {

      showLoginMessage(
        "Login failed: " +
        error.message
      );

    });

}



/* =========================
   AUTH STATE
========================= */

auth.onAuthStateChanged(user => {

  if(user){

    document
      .getElementById("loginBox")
      .classList
      .add("hidden");


    document
      .getElementById("adminBox")
      .classList
      .remove("hidden");


    document
      .getElementById("adminEmail")
      .innerText =
        user.email;


    loadContent();

  }

  else{

    document
      .getElementById("loginBox")
      .classList
      .remove("hidden");


    document
      .getElementById("adminBox")
      .classList
      .add("hidden");

  }

});



/* =========================
   LOGOUT
========================= */

function logout(){

  auth.signOut();

}



/* =========================
   PUBLISH / UPDATE
========================= */

async function publish(){

  const type =
    document
      .getElementById("type")
      .value;


  const title =
    document
      .getElementById("title")
      .value
      .trim();


  const details =
    document
      .getElementById("details")
      .value
      .trim();


  const link =
    document
      .getElementById("link")
      .value
      .trim();


  const contentDate =
    document
      .getElementById("contentDate")
      .value;


  if(!title){

    alert(
      "Please enter a title."
    );

    return;
  }


  try{


    /* EDIT */

    if(editingId){

      await db
        .collection(type)
        .doc(editingId)
        .update({

          title:title,

          details:details,

          link:link,

          date:
            contentDate ||
            new Date()
              .toISOString()
              .split("T")[0],

          updatedAt:
            new Date()
              .toISOString()

        });


      showMessage(
        "✓ Updated successfully!"
      );


      editingId = null;


      document
        .getElementById("publishButton")
        .innerText =
          "🚀 PUBLISH";


      document
        .getElementById("cancelButton")
        .classList
        .add("hidden");

    }


    /* NEW CONTENT */

    else{

      await db
        .collection(type)
        .add({

          title:title,

          details:details,

          link:link,

          date:
            contentDate ||
            new Date()
              .toISOString()
              .split("T")[0],

          createdBy:
            auth.currentUser.email,

          createdAt:
            new Date()
              .toISOString()

        });


      showMessage(
        "✓ Published successfully!"
      );

    }


    clearForm();

    loadContent();


  }

  catch(error){

    showMessage(
      "Error: " +
      error.message
    );

  }

}



/* =========================
   LOAD CONTENT
========================= */

async function loadContent(){

  const type =
    document
      .getElementById("manageType")
      .value;


  const list =
    document
      .getElementById("contentList");


  list.innerHTML =
    '<div class="status">Loading...</div>';


  try{

    const snapshot =
      await db
        .collection(type)
        .get();


    if(snapshot.empty){

      list.innerHTML =
        '<div class="status">No content published yet.</div>';

      return;
    }


    let html = "";


    snapshot.forEach(doc => {

      const data =
        doc.data();


      const title =
        escapeHtml(
          data.title || ""
        );


      const details =
        escapeHtml(
          data.details || ""
        );


      const date =
        formatDate(
          data.date
        );


      const safeLink =
        safeUrl(
          data.link || ""
        );


      html += `

        <div class="item">

          <div class="item-title">
            ${title}
          </div>


          ${
            date
              ? `
                <div class="item-date">
                  📅 ${date}
                </div>
              `
              : ""
          }


          ${
            details
              ? `
                <div class="item-details">
                  ${details}
                </div>
              `
              : ""
          }


          ${
            safeLink
              ? `
                <a
                  class="item-link"
                  href="${safeLink}"
                  target="_blank"
                  rel="noopener noreferrer">

                  🔗 Open PDF / Link →

                </a>
              `
              : ""
          }


          <div class="item-actions">

            <button
              class="edit"
              onclick="editContent(
                '${type}',
                '${doc.id}'
              )">

              ✏️ EDIT

            </button>


            <button
              class="delete"
              onclick="deleteContent(
                '${type}',
                '${doc.id}'
              )">

              🗑️ DELETE

            </button>

          </div>

        </div>

      `;

    });


    list.innerHTML =
      html;


  }

  catch(error){

    list.innerHTML =
      `
        <div class="status">
          Error loading content:<br>
          ${escapeHtml(error.message)}
        </div>
      `;

  }

}



/* =========================
   EDIT
========================= */

async function editContent(
  type,
  id
){

  try{

    const doc =
      await db
        .collection(type)
        .doc(id)
        .get();


    if(!doc.exists){

      alert(
        "Content not found."
      );

      return;
    }


    const data =
      doc.data();


    document
      .getElementById("type")
      .value =
        type;


    document
      .getElementById("title")
      .value =
        data.title || "";


    document
      .getElementById("details")
      .value =
        data.details || "";


    document
      .getElementById("link")
      .value =
        data.link || "";


    document
      .getElementById("contentDate")
      .value =
        data.date || "";


    editingId =
      id;


    document
      .getElementById("publishButton")
      .innerText =
        "✓ UPDATE";


    document
      .getElementById("cancelButton")
      .classList
      .remove("hidden");


    window.scrollTo({

      top:0,

      behavior:"smooth"

    });

  }

  catch(error){

    alert(
      error.message
    );

  }

}



/* =========================
   DELETE
========================= */

async function deleteContent(
  type,
  id
){

  const ok =
    confirm(
      "Are you sure you want to delete this content?"
    );


  if(!ok){

    return;
  }


  try{

    await db
      .collection(type)
      .doc(id)
      .delete();


    showMessage(
      "✓ Deleted successfully!"
    );


    loadContent();

  }

  catch(error){

    showMessage(
      "Delete error: " +
      error.message
    );

  }

}



/* =========================
   CANCEL EDIT
========================= */

function cancelEdit(){

  editingId = null;

  clearForm();


  document
    .getElementById("publishButton")
    .innerText =
      "🚀 PUBLISH";


  document
    .getElementById("cancelButton")
    .classList
    .add("hidden");

}



/* =========================
   CLEAR FORM
========================= */

function clearForm(){

  document
    .getElementById("title")
    .value = "";


  document
    .getElementById("details")
    .value = "";


  document
    .getElementById("link")
    .value = "";


  document
    .getElementById("contentDate")
    .value = "";

}



/* =========================
   MESSAGE
========================= */

function showMessage(text){

  const box =
    document
      .getElementById("message");


  box.innerText =
    text;


  box.classList
    .add("show");


  setTimeout(() => {

    box.classList
      .remove("show");

  },4000);

}


function showLoginMessage(text){

  const box =
    document
      .getElementById("loginMessage");


  box.innerText =
    text;


  box.classList
    .add("show");

}



/* =========================
   DATE FORMAT
========================= */

function formatDate(value){

  if(!value){

    return "";
  }


  const date =
    new Date(
      value + "T00:00:00"
    );


  if(
    Number.isNaN(
      date.getTime()
    )
  ){

    return escapeHtml(
      value
    );

  }


  return date.toLocaleDateString(
    "en-IN",
    {
      day:"2-digit",
      month:"s
