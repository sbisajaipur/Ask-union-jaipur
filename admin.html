</div>  </div>  <!-- FIREBASE -->  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>  <script>  
  
const firebaseConfig = {  
  apiKey: "AIzaSyAzMEREwPKnifSIrB5Cva8D-CFbVIa5zF0",  
  authDomain: "ask-union-jaipur-circle.firebaseapp.com",  
  projectId: "ask-union-jaipur-circle",  
  storageBucket: "ask-union-jaipur-circle.firebasestorage.app",  
  messagingSenderId: "584327754977",  
  appId: "1:584327754977:web:7164a85c007165743ef3a0"  
};  
  
firebase.initializeApp(firebaseConfig);  
  
const auth = firebase.auth();  
const db = firebase.firestore();  
  
let editingId = null;  
  
  
// LOGIN  
  
function login(){  
  
  const email =  
    document.getElementById("email").value.trim();  
  
  const password =  
    document.getElementById("password").value;  
  
  auth.signInWithEmailAndPassword(email,password)  
  
  .catch(error=>{  
    document.getElementById("loginMessage").innerText =  
      "Login failed: " + error.message;  
  });  
}  
  
  
// AUTH STATE  
  
auth.onAuthStateChanged(user=>{  
  
  if(user){  
  
    document.getElementById("loginBox")  
      .classList.add("hidden");  
  
    document.getElementById("adminBox")  
      .classList.remove("hidden");  
  
    document.getElementById("adminEmail")  
      .innerText=user.email;  
  
    loadContent();  
  
  }else{  
  
    document.getElementById("loginBox")  
      .classList.remove("hidden");  
  
    document.getElementById("adminBox")  
      .classList.add("hidden");  
  
  }  
  
});  
  
  
// LOGOUT  
  
function logout(){  
  auth.signOut();  
}  
  
  
// PUBLISH  
  
async function publish(){  
  
  const type =  
    document.getElementById("type").value;  
  
  const title =  
    document.getElementById("title").value.trim();  
  
  const details =  
    document.getElementById("details").value.trim();  
  
  const link =  
    document.getElementById("link").value.trim(); document.getElementById("contentDate").value =
  data.date || ""; 
  
  if(!title){  
  
    alert("Please enter a title.");  
  
    return;  
  }  
  
  
  try{  
  
    if(editingId){  
  
      await db.collection(type)  
        .doc(editingId)  
        .update({  
  
          title:title,  
          details:details,  
          link:link,  
          date:contentDate  
  
        });  
  
      showMessage("✓ Updated successfully!");  
  
      editingId=null;  
  
      document.getElementById("publishButton")  
        .innerText="PUBLISH";  
  
      document.getElementById("cancelButton")  
        .classList.add("hidden");  
  
    }else{  
  
      await db.collection(type).add({  
  
        title:title,  
        details:details,  
        link:link,  
        date:new Date().toISOString(),  
        createdBy:auth.currentUser.email  
  
      });  
  
      showMessage("✓ Published successfully!");  
  
    }  
  
  
    clearForm();  
  
    loadContent();  
  
  }catch(error){  
  
    showMessage("Error: "+error.message);  
  
  }  
  
}  
  
  
// LOAD CONTENT  
  
async function loadContent(){  
  
  const type =  
    document.getElementById("manageType").value;  
  
  const list =  
    document.getElementById("contentList");  
  
  list.innerHTML="Loading...";  
  
  
  try{  
  
    const snapshot =  
      await db.collection(type).get();  
  
    if(snapshot.empty){  
  
      list.innerHTML=  
        "<p>No content published yet.</p>";  
  
      return;  
    }  
  
  
    let html="";  
  
  
    snapshot.forEach(doc=>{  
  
      const data=doc.data();  
  
      html += `  
  
        <div class="item">  
  
          <b>${escapeHtml(data.title || "")}</b>  
  
          <div class="small">  
            ${data.date || ""}  
          </div>  
  
          <p>  
            ${escapeHtml(data.details || "")}  
          </p>  
  
          ${  
            data.link  
            ? `<p><a href="${data.link}" target="_blank">  
                 Open PDF / Link  
               </a></p>`  
            : ""  
          }  
  
          <button  
            class="edit"  
            onclick="editContent('${type}','${doc.id}')">  
            EDIT  
          </button>  
  
          <button  
            class="delete"  
            onclick="deleteContent('${type}','${doc.id}')">  
            DELETE  
          </button>  
  
        </div>  
  
      `;  
  
    });  
  
  
    list.innerHTML=html;  
  
  }catch(error){  
  
    list.innerHTML=  
      "Error loading content: "+error.message;  
  
  }  
  
}  
  
  
// EDIT  
  
async function editContent(type,id){  
  
  try{  
  
    const doc =  
      await db.collection(type).doc(id).get();  
  
    if(!doc.exists){  
  
      alert("Content not found.");  
  
      return;  
    }  
  
    const data=doc.data();  
  
    document.getElementById("type").value=type;  
  
    document.getElementById("title").value=  
      data.title || "";  
  
    document.getElementById("details").value=  
      data.details || "";  
  
    document.getElementById("link").value=  
      data.link || "";  
  
    editingId=id;  
  
    document.getElementById("publishButton")  
      .innerText="UPDATE";  
  
    document.getElementById("cancelButton")  
      .classList.remove("hidden");  
  
    window.scrollTo({  
      top:0,  
      behavior:"smooth"  
    });  
  
  }catch(error){  
  
    alert(error.message);  
  
  }  
  
}  
  
  
// DELETE  
  
async function deleteContent(type,id){  
  
  const ok =  
    confirm("Are you sure you want to delete this content?");  
  
  if(!ok) return;  
  
  
  try{  
  
    await db.collection(type)  
      .doc(id)  
      .delete();  
  
    showMessage("✓ Deleted successfully!");  
  
    loadContent();  
  
  }catch(error){  
  
    showMessage("Delete error: "+error.message);  
  
  }  
  
}  
  
  
// CANCEL EDIT  
  
function cancelEdit(){  
  
  editingId=null;  
  
  clearForm();  
  
  document.getElementById("publishButton")  
    .innerText="PUBLISH";  
  
  document.getElementById("cancelButton")  
    .classList.add("hidden");  
  
}  
  
  
// CLEAR FORM  
  
function clearForm(){  
  
  document.getElementById("title").value="";  
  document.getElementById("details").value="";  
  document.getElementById("link").value="";  
  
}  
  
  
// MESSAGE  
  
function showMessage(text){  
  
  document.getElementById("message")  
    .innerText=text;  
  
}  
  
  
// BASIC HTML SAFETY  
  
function escapeHtml(text){  
  
  return String(text)  
    .replace(/&/g,"&amp;")  
    .replace(/</g,"&lt;")  
    .replace(/>/g,"&gt;")  
    .replace(/"/g,"&quot;")  
    .replace(/'/g,"&#039;");  
  
}  
  
</script>  </body>
