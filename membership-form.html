<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SBISA Get Membership</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eef0f3;font-family:Arial,Helvetica,sans-serif;color:#222}
.wrap{max-width:900px;margin:auto;padding:10px}
.top{background:#7b1024;color:#fff;border-radius:12px;padding:16px;margin-bottom:10px}
.top h1{margin:0;font-size:21px}.top p{margin:5px 0 0;font-size:12px}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:0 2px 8px #0001}
h2{font-size:16px;color:#7b1024;margin:0 0 12px;border-bottom:1px solid #ddd;padding-bottom:7px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.full{grid-column:1/-1}
label{font-size:12px;font-weight:bold;display:block;margin-bottom:4px}
input,textarea,select{width:100%;padding:12px;border:1px solid #c8cdd5;border-radius:8px;font-size:16px;min-height:46px;background:#fff}
textarea{min-height:75px}
button{width:100%;padding:13px;border:0;border-radius:9px;background:#7b1024;color:#fff;font-size:15px;font-weight:bold}
#status{font-size:12px;margin-top:9px}
@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
@media print{
 body{background:#fff}
 .no-print{display:none!important}
 .print-doc{display:block!important}
}
.print-doc{display:none}
.page{width:210mm;min-height:297mm;padding:16mm 16mm 14mm;margin:auto;background:#fff;page-break-after:always}
.page:last-child{page-break-after:auto}
.ptitle{text-align:center;font-weight:bold;font-size:11pt;border-bottom:1px solid #222;padding-bottom:5px;margin-bottom:12mm}
.line{border-bottom:1px solid #222;display:inline-block;min-width:65mm;height:4mm;vertical-align:bottom}
.field{display:flex;align-items:baseline;margin:5mm 0;font-size:10pt}
.field .lbl{width:55mm}.field .val{flex:1;border-bottom:1px solid #222;min-height:6mm;padding-left:2mm}
.para{font-size:10pt;line-height:1.55;text-align:justify;margin:6mm 0}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:18mm}
@page{size:A4;margin:0}
@media(max-width:650px){.page{width:100%;min-height:auto;padding:10mm}.field{margin:4mm 0}}
</style>
</head>
<body>
<div class="wrap no-print">
<div class="top"><h1>🪪 Get Membership</h1><p>SBISA Jaipur Circle • Membership Application</p></div>

<form id="form">
<div class="card"><h2>Applicant Details</h2><div class="grid">
<div><label>Name in Full (Block Letter) *</label><input id="name" required></div>
<div><label>P.F. No. *</label><input id="pf" required></div>
<div><label>Designation *</label><input id="designation" required></div>
<div><label>Department / Branch *</label><input id="branch" required></div>
<div><label>Date of Appointment *</label><input id="appointment" type="date" required></div>
<div><label>Mobile No.</label><input id="mobile"></div>
<div><label>E-Mail ID</label><input id="email" type="email"></div>
<div><label>Dated *</label><input id="date" type="date" required></div>
<div class="full"><label>Residential Address</label><textarea id="address"></textarea></div>
<div><label>Signature</label><input id="signature"></div>
</div></div>

<div class="card"><h2>Union Subscription Authorisation</h2><div class="grid">
<div class="full"><label>Previous Union</label><input id="previousUnion"></div>
<div><label>Stop deduction from month</label><input id="stopMonth"></div>
<div><label>SBISA deduction commencing from</label><input id="startMonth"></div>
<div><label>Monthly Subscription</label><select id="subscription"><option value="100">Rs. 100/-</option><option value="50">Rs. 50/-</option></select></div>
<div><label>Branch Code</label><input id="branchCode"></div>
</div></div>

<div class="card">
<button type="submit">Generate / Print Membership PDF</button>
<div id="status"></div>
</div>
</form>
</div>

<div id="printDoc" class="print-doc"></div>

<script>
const $=id=>document.getElementById(id);
const v=id=>$(id).value.trim();
function d(id){
 const x=v(id); if(!x)return "";
 const a=x.split("-"); return a.length===3?a[2]+"."+a[1]+"."+a[0]:x;
}
function esc(x){
 return String(x||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function field(label,value){return '<div class="field"><div class="lbl">'+esc(label)+'</div><div class="val">'+esc(value)+'</div></div>'}

$("form").addEventListener("submit",function(e){
 e.preventDefault();

 const name=v("name"),pf=v("pf"),designation=v("designation"),branch=v("branch");
 const appointment=d("appointment"),mobile=v("mobile"),email=v("email"),date=d("date");
 const address=v("address"),signature=v("signature"),previous=v("previousUnion");
 const stop=v("stopMonth"),start=v("startMonth"),subscription=v("subscription"),code=v("branchCode");

 const p1=`
 <section class="page">
  <div class="ptitle">APPENDIX-'A'</div>
  <div style="font-size:10pt;line-height:1.55">
   <div>To,</div>
   <div>The Chief Secretary,</div>
   <div>State Bank of India Staff Association,</div>
   <div>(Registration No. 34, dated 24.05.1932, Kolkata)</div>
   <div>Ajit Sen Bhawan, 13, Crooked Lane,</div>
   <div>KOLKATA (West Bengal)-700069.</div>
   <br>
   <div><b>(Through The General Secretary, State Bank of India Staff Association, Jaipur Circle-Rajasthan)</b></div>
   <br>Dear Sir,
  </div>
  <div class="para">I request you to enlist me as an Ordinary Member of the Association and remit herewith Admission Fee of 100/-* as per Rule 6 of the Rules and Constitution of the Association.</div>
  <div class="para">I have read the Rules and Constitution of the Association and will abide by them as amended from time to time.</div>
  <div class="twocol"><div>Dated: ${esc(date)}</div><div>Comradely Yours,</div></div>
  <div class="para">Signature: ${esc(signature)}</div>
  ${field("Name in Full (Block Letter)",name)}
  ${field("P.F. No.",pf)}
  ${field("Designation",designation)}
  ${field("Department/Branch",branch)}
  ${field("Date of Appointment",appointment)}
  ${field("Residential Address",address)}
  ${field("Mobile No.",mobile)}
  ${field("E-Mail ID.",email)}
 </section>`;

 const q1=`I submit that I am a member of ${esc(previous||"____________________________")} Union whose subscription is being deducted from my salary month. Since I have resigned from the primary membership of this Union, you are requested to kindly stop deduction the monthly subscription from my salary with immediate effect i.e. ${esc(stop||"____________")} month.`;
 const q2=`2. I further submit that I have joined State Bank of India Staff Association (SBISA), Jaipur Circle, therefore, I request you to deduct a sum of ${esc(subscription)} every month from my salary and allowances payable to me by the Bank commencing from ${esc(start||"____________")} and remit the same to The General Secretary, State Bank of India Staff Association, Jaipur Circle (A/c no.37015276049).`;

 const auth=page=>`
 <section class="page">
  <div class="ptitle">AUTHORISATION TO BE DEDUCT UNION SUBSCRIPTION</div>
  <div style="font-size:10pt;line-height:1.5">
   The Asstt. General Manager/ Chief Manager/ Branch Manager<br>
   State Bank of India<br><br>
   Madam/ Dear Sir,
  </div>
  <div class="para">${q1}</div>
  <div class="para">${q2}</div>
  <div class="para">3. This authorization shall continue to be effective for revised rates in future also till I revoke the same.</div>
  <div class="para">Thanking you,</div>
  <div class="para">(Signature in full)</div>
  ${field("Name (In block letters)",name)}
  ${field("Designation",designation)}
  ${field("P.F.No.",pf)}
  ${field("Branch/ Deptt.",branch)}
  ${field("Branch Code",code)}
 </section>`;

 $("printDoc").innerHTML=p1+auth(2)+auth(3);
 $("status").textContent="3-page membership form ready. Choose 'Save as PDF' in the print screen.";
 $("status").style.color="#176b35";

 // Native print is used deliberately: it works without jsPDF, CDN access,
 // popups, or downloads being enabled by the mobile browser.
 setTimeout(()=>window.print(),200);
});
</script>
</body>
</html>
