<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#7b1024">
<title>Member Dashboard — ASK UNION</title>
<link rel="icon" href="./ask-union-icon-192.png">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f5f7;color:#252525}
.top{background:#7b1024;color:#fff;padding:18px 16px 22px;position:relative}
.wrap{max-width:1050px;margin:auto}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:48px;height:48px;border-radius:12px;background:#fff;padding:3px}
.brand h1{font-size:20px;margin:0}
.brand p{margin:3px 0 0;font-size:12px;opacity:.9}
.logout{position:absolute;right:16px;top:18px;border:1px solid rgba(255,255,255,.65);background:transparent;color:#fff;border-radius:9px;padding:8px 12px;cursor:pointer}
.content{max-width:1050px;margin:18px auto 35px;padding:0 14px}
.profile{background:#fff;border-radius:16px;padding:20px;box-shadow:0 3px 14px rgba(0,0,0,.07);display:flex;align-items:center;gap:18px}
.avatar{width:70px;height:70px;border-radius:50%;background:#7b1024;color:#fff;display:grid;place-items:center;font-size:27px;font-weight:700}
.profile h2{margin:0 0 6px;font-size:22px}
.muted{color:#777;font-size:13px;margin:4px 0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}
.stat{background:#fff;border-radius:14px;padding:16px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.stat b{font-size:23px;color:#7b1024;display:block;margin-bottom:4px}
.stat span{font-size:12px;color:#777}
.section-title{font-size:18px;margin:22px 0 10px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.card{background:#fff;border-radius:14px;padding:17px;box-shadow:0 2px 10px rgba(0,0,0,.05);min-height:125px}
.card h3{font-size:15px;margin:0 0 8px}
.card p{font-size:12px;color:#777;line-height:1.45;margin:0 0 13px}
.btn{display:inline-block;border:0;border-radius:8px;padding:8px 11px;background:#7b1024;color:#fff;text-decoration:none;font-size:12px;cursor:pointer}
.btn.light{background:#eee;color:#333}
.info{background:#fff;border-radius:14px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.row{display:grid;grid-template-columns:180px 1fr;border-bottom:1px solid #eee;padding:10px 0;font-size:13px}
.row:last-child{border-bottom:0}
.label{color:#777}.value{font-weight:600}
.notice{background:#fff7e8;border-left:4px solid #d99000;padding:12px 14px;border-radius:8px;font-size:12px;margin-top:15px}
.loading{text-align:center;padding:50px;color:#777}
.error{background:#fff;border-radius:12px;padding:20px;text-align:center}
@media(max-width:700px){
 .top{padding:14px 14px 20px}
 .brand h1{font-size:17px}.brand p{font-size:10px}
 .logout{top:15px;right:12px;padding:7px 9px;font-size:11px}
 .profile{padding:15px;gap:12px}.avatar{width:58px;height:58px;font-size:22px}.profile h2{font-size:18px}
 .grid{grid-template-columns:repeat(2,1fr)}
 .cards{grid-template-columns:1fr}
 .row{grid-template-columns:125px 1fr}
}
</style>
</head>
<body>
<header class="top">
<div class="wrap">
<div class="brand">
<img class="logo" src="./ask-union-icon-192.png" alt="ASK UNION">
<div><h1>ASK UNION</h1><p>SBISA UDAIPUR MODULE — MEMBER DASHBOARD</p></div>
</div>
<button class="logout" onclick="logout()">Logout</button>
</div>
</header>

<main class="content" id="app">
<div class="loading">Loading your member dashboard…</div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={
 apiKey:"AIzaSyAzMEREwPKnifSIrB5Cva8D-CFbVIa5zF0",
 authDomain:"ask-union-jaipur-circle.firebaseapp.com",
 projectId:"ask-union-jaipur-circle",
 storageBucket:"ask-union-jaipur-circle.firebasestorage.app",
 messagingSenderId:"584327754977",
 appId:"1:584327754977:web:7164a85c007165743ef3a"
};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.firestore();

function esc(v){
 return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}
function initials(name){
 const a=String(name||'Member').trim().split(/\s+/).filter(Boolean);
 return ((a[0]?.[0]||'M')+(a.length>1?(a[a.length-1]?.[0]||''):'')).toUpperCase();
}
async function loadDashboard(user){
 try{
  const snap=await db.collection('members').doc(user.uid).get();
  if(!snap.exists || snap.data().active!==true){
   await auth.signOut(); sessionStorage.removeItem('askUnionMember');
   location.href='./'; return;
  }
  const d=snap.data()||{};
  sessionStorage.setItem('askUnionMember',JSON.stringify({
   uid:user.uid,employeeNo:d.employeeNo||'',membershipNo:d.membershipNo||'',name:d.name||'',
   designation:d.designation||'',branch:d.branch||'',mobile:d.mobile||''
  }));
  document.getElementById('app').innerHTML=`
   <section class="profile">
    <div class="avatar">${esc(initials(d.name))}</div>
    <div>
     <h2>Welcome, ${esc(d.name||'Member')}</h2>
     <div class="muted">${esc(d.designation||'Union Member')}${d.branch?' · '+esc(d.branch):''}</div>
     <div class="muted">Employee No.: <b>${esc(d.employeeNo||'—')}</b> · Membership No.: <b>${esc(d.membershipNo||'—')}</b></div>
    </div>
   </section>

   <section class="grid">
    <div class="stat"><b>0</b><span>My Queries</span></div>
    <div class="stat"><b>0</b><span>In Process</span></div>
    <div class="stat"><b>0</b><span>Notices</span></div>
    <div class="stat"><b>0</b><span>Events</span></div>
   </section>

   <h3 class="section-title">Member Services</h3>
   <section class="cards">
    <div class="card"><h3>👤 My Profile</h3><p>View your registered member information.</p><button class="btn" onclick="showProfile()">View Profile</button></div>
    <div class="card"><h3>📝 My Queries</h3><p>Member grievance/query facility will be connected here.</p><button class="btn light" onclick="coming()">Coming Soon</button></div>
    <div class="card"><h3>📄 My Documents</h3><p>Member documents and union forms can be accessed here.</p><a class="btn" href="./documents.html">Document Centre</a></div>
    <div class="card"><h3>📅 Event Registration</h3><p>Registration for union events will be available here.</p><button class="btn light" onclick="coming()">Coming Soon</button></div>
    <div class="card"><h3>🔔 Notifications</h3><p>Member notifications will appear here.</p><button class="btn light" onclick="coming()">Coming Soon</button></div>
    <div class="card"><h3>🔗 Important Links</h3><p>Open the public ASK UNION information and resources.</p><a class="btn" href="./documents.html">Open</a></div>
   </section>

   <h3 class="section-title">My Profile</h3>
   <section class="info" id="profileBox">
    <div class="row"><div class="label">Name</div><div class="value">${esc(d.name||'—')}</div></div>
    <div class="row"><div class="label">Employee No.</div><div class="value">${esc(d.employeeNo||'—')}</div></div>
    <div class="row"><div class="label">Membership No.</div><div class="value">${esc(d.membershipNo||'—')}</div></div>
    <div class="row"><div class="label">Designation</div><div class="value">${esc(d.designation||'—')}</div></div>
    <div class="row"><div class="label">Branch</div><div class="value">${esc(d.branch||'—')}</div></div>
    <div class="row"><div class="label">Mobile</div><div class="value">${esc(d.mobile||'—')}</div></div>
   </section>

   <h3 class="section-title">Recent Updates</h3>
   <section class="info"><p style="margin:0;font-size:13px;color:#777">Latest union updates are available on the public Updates section.</p><br><a class="btn" href="./">Go to ASK UNION Home</a></section>
   <div class="notice">Your member account is controlled by the Union Admin. If any profile detail is incorrect, please contact the Union Admin.</div>
  `;
 }catch(e){
  console.error(e);
  document.getElementById('app').innerHTML='<div class="error">Unable to load your member profile.<br><br><button class="btn" onclick="logout()">Back to Home</button></div>';
 }
}
function showProfile(){document.getElementById('profileBox')?.scrollIntoView({behavior:'smooth'});}
function coming(){alert('This member service will be connected in the next update.');}
async function logout(){
 try{await auth.signOut();}catch(e){}
 sessionStorage.removeItem('askUnionMember');
 location.href='./';
}
auth.onAuthStateChanged(user=>{
 if(!user){location.href='./';return;}
 loadDashboard(user);
});
</script>
</body>
</html>
